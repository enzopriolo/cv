plugins {
    id 'com.android.application'
}

android {
    namespace 'de.enzo.billard'
    compileSdk 35

    defaultConfig {
        applicationId 'de.enzo.billard'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        // Fester Schlüssel, damit spätere Versionen als Update installiert werden können.
        release {
            storeFile file('billard.jks')
            storePassword 'billard123'
            keyAlias 'billard'
            keyPassword 'billard123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
