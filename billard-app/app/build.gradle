plugins {
    id 'com.android.application'
}

android {
    namespace 'de.enzo.billard'
    compileSdk 35

    defaultConfig {
        applicationId 'de.enzo.billard'
        minSdk 26
        targetSdk 35
        versionCode 26
        versionName '6.3'
    }

    signingConfigs {
        // Für den Play Store: eigener, geheimer Schlüssel über Umgebungsvariablen (GitHub-Secrets).
        // Ohne Secrets wird der Test-Schlüssel aus dem Repository benutzt (nur für die direkte APK).
        release {
            def ks = System.getenv('BILLARD_KEYSTORE')
            storeFile file(ks ? ks : 'billard.jks')
            storePassword System.getenv('BILLARD_STORE_PASS') ?: 'billard123'
            keyAlias System.getenv('BILLARD_KEY_ALIAS') ?: 'billard'
            keyPassword System.getenv('BILLARD_KEY_PASS') ?: 'billard123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
